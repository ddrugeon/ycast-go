name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    name: Cross-compiled binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          fetch-depth: 0 # git describe for the version string
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (node24)
        with:
          go-version-file: go.mod
      - name: Build all targets
        run: ./build.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: binaries
          path: dist/ycast-go-linux-*

  deb:
    name: Debian package (amd64)
    runs-on: ubuntu-latest
    container: debian:trixie-20261005@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5 # debian:trixie-20261005
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git dpkg-dev debhelper golang
      - name: Build the package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp -r packaging/deb/debian .
          sed -i "1s/ycast-go (.*)/ycast-go (${VERSION})/" debian/changelog
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          mv ../ycast-go_*.deb dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: deb
          path: dist/*.deb

  rpm:
    name: RPM package (x86_64)
    runs-on: ubuntu-latest
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 # fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: dnf install -y go rpm-build git-core
      - name: Build the package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^Version:        .*/Version:        ${VERSION}/" packaging/rpm/ycast-go.spec
          rpmbuild_topdir="$PWD/rpmbuild"
          mkdir -p "$rpmbuild_topdir"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          tar czf "$rpmbuild_topdir/SOURCES/ycast-go-${VERSION}.tar.gz" \
              --transform "s,^,ycast-go-${VERSION}/," \
              --exclude=.git --exclude=dist --exclude=rpmbuild .
          cp packaging/rpm/ycast-go.spec "$rpmbuild_topdir/SPECS/"
          rpmbuild -bb --define "_topdir $rpmbuild_topdir" \
              "$rpmbuild_topdir/SPECS/ycast-go.spec"
          mkdir -p dist
          mv "$rpmbuild_topdir"/RPMS/*/*.rpm dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: rpm
          path: dist/*.rpm

  docker:
    name: Docker image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - name: Compute version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0 (node24)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 (node24)
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 (node24)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 (node24)
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 (node24)
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}

  release:
    name: Publish release
    needs: [binaries, deb, rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (node24)
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --clobber \
            artifacts/*.deb artifacts/*.rpm artifacts/ycast-go-linux-*
